<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="h1.css">
</head>
<body>
    <div class="parent">
    <div class="child">
        <input type="text" placeholder="0" id="myInput">
        <div class="row1">
            <button style="color: orange;">AC</button>
            <button style="color: orange;">DEL</button>
            <button style="color: orange;">%</button>
            <button style="color: orange;">/</button>
        </div>
        <div class="row1">
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button style="color: orange;">*</button>
        </div>
        <div class="row1">
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button style="color: orange;">-</button>
        </div>
        <div class="row1">
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button style="color: orange;">+</button>
        </div>
        <div class="row1">
            <button>00</button>
            <button>0</button>
            <button>.</button>
            <button style="color: orange;">=</button>
        </div>
    </div>
    </div>
    <script src="h1.js"></script>
</body>
</html>
